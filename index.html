<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Real Kanye</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen font-mono">
    <header class="min-h-[8vh] bg-[url(./assets/paper.avif)] p-4 flex justify-between items-center lg:px-14 lg:border-b-1 lg:border-[#6b6666]" >
        <img src="./assets/kanyelogo.png" class="lg:hidden" width="70" alt="">
        <img src="./assets/kanyelogo.png"class="hidden lg:block cursor-pointer" width="100" alt="">
        <div class="flex gap-4 text-xs lg:text-xl lg:gap-15 text-[#434242]">
        <p class="cursor-pointer hover:text-black">STORY</p>
        <P class="cursor-pointer hover:text-black">MUSIC</P>
        <P class="cursor-pointer hover:text-black">ARCHIVE</P>
        </div>
        <i class="ri-menu-line cursor-pointer   "></i>
    </header>

    <main class=" relative [80vh] bg-blue-500 bg-[url(./assets/paper.avif)] lg:flex lg:justify-center">
        <!-- PC Config -->
       <div class="lg:w-[100vw] lg:min-h-screen lg:flex lg:justify-center lg:items-start">
        <img src="./assets/kanyeHero.png" class="hidden lg:block w-[102vh] mr-100 " alt="">

        <div class="hidden absolute lg:right-[82vw] rotate-5 top-[1vh] lg: block lg:flex lg:flex-col lg:justify-center lg:items-center lg:bg-[url(./assets/quoteBg.png)] lg:bg-contain lg:bg-center lg:bg-no-repeat lg:p-23 lg:text-left">
                <p class="hidden lg:block lg:text-[3vh]">“Everything <br> I'm <br> not makes <br> me everything <br> I am”</p>
                <br>
                <p class=" hidden lg:block :font-bold lg:text-l"> <i class="ri-subtract-line"></i>Kanye West</p>
            </div>

            <img width="600" class="hidden lg:block lg:absolute left-0 top-[40vh]" src="./assets/kanyepiano.png" alt="">
            <img width="500" class="hidden lg:block lg:absolute left-[65vw] top-[46vh]" src="./assets/rightpic.png" alt="">

            <h1 class=" absolute left-[48vw] top-[1vh] hidden lg:block text-[25vh] bold font-black leading-50 text-right font-[Helvetica]">Kanye<br>West</h1>
            <p class="hidden lg:block absolute font-bold font-[Helvetica] ml-2 text-4xl left-[60vw] tracking-[2vh] top-[45vh]">THE BEGINNING</p>
            <p class="hidden lg:block absolute text-l font-thin left-[65vw] top-[50vh] ">Before The World Called Him "YE".</p>
            <img class="hidden lg:block absolute left-[90vw] bottom-[30vh] opacity-50" src="./assets/texts.png" width="500" alt="">

       </div>
       <!-- Phone Config -->
        <div class="min-h-[100vh] bg-[url(./assets/kanyeHero.png)] lg:bg-contain  bg-no-repeat bg-contain flex flex-col relative lg:hidden">
            <div class="relative flex flex-col justify-center items-center  w-full max-w-sm bg-[url(./assets/quoteBg.png)] bg-contain bg-center bg-no-repeat p-7 text-left left-[-16vh]">
                <p class="text-[1.5vh]">“Everything <br> I'm <br> not makes <br> me everything <br> I am”</p>
                <br>
                <p class="font-bold text-xs"> <i class="ri-subtract-line"></i>Kanye West</p>
            </div>
            <img class="absolute left-[70%]" src="./assets/Dreams.png" width="100" alt="">
            <img class="absolute left-[75%] top-[8%] rotate-8" src="./assets/texts.png" width="60" alt="">
            <div class="flex justify-center mt-25 flex-col items-center p-2">

                <h1 class="font-sans font-bold text-[13vh] scale-y-130">KANYE</h1>
                <p class="tracking-[1.5vh] font-bold scale-y-130 scale-x-110 ml-2">The Beginning</p>
                <p class="text-xs">Before The World Called Him "YE".</p>

            </div>
            <div class="flex justify-end gap-5 items-center px-6">
                <div class=" w-[30vh] h-[0.2vh] bg-black"></div>
                <p class="text-sm ">Scroll</p>
                <i class="ri-arrow-down-long-line"></i>
            </div>
        </div>

            

    </main>
    <section class="min-h-[200vh] bg-yellow-500"></section>
    <section class="min-h-[300vh] bg-pink-500"></section>
</body>
</html>
